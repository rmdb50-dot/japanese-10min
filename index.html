<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182b55"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><title>매일 10분 일본어</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#182235;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#182b55,#3568d4);color:white;padding:24px;border-radius:22px}.hero h1{margin:6px 0}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin:12px 0}.muted{color:#68758a;font-size:14px}.jp{font-size:34px;font-weight:800;margin:16px 0 4px}.reading{color:#6b7890}.meaning{font-size:20px;font-weight:700;margin:10px 0}button{border:0;border-radius:12px;padding:13px 15px;font-weight:700;font-size:15px;background:#eaf1ff;color:#18376f;margin:4px;cursor:pointer}.primary{background:#3568d4;color:white}.bar{height:9px;background:#e9edf5;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#26a477;width:0} .option{display:block;width:100%;text-align:left;margin:8px 0;background:#f6f8fc}footer{text-align:center;color:#7d8798;font-size:12px;padding:16px}
</style></head><body><main>
<header class="hero"><small>BEGINNER JAPANESE · DAILY 10 MINUTES</small><h1>매일 10분, 일본어로 말하기 🇯🇵</h1><p>듣고, 따라 말하고, 짧게 대답해요. 완벽하게 외우지 않아도 괜찮아요!</p></header>
<section class="card"><div class="muted" id="day">1일차 · 오늘의 표현</div><div class="bar"><span id="progress"></span></div><div class="jp" id="jp"></div><div class="reading" id="reading"></div><div class="meaning" id="meaning"></div><p class="muted" id="tip"></p><button onclick="speak(.9)">🔊 보통 속도</button><button onclick="speak(.62)">🐢 천천히</button><button class="primary" onclick="next()">다음 표현 →</button></section>
<section class="card"><b>오늘의 뜻 맞히기</b><p id="question"></p><div id="options"></div><p id="feedback" class="muted"></p></section>
<section class="card"><b>내 학습 기록</b><p id="record" class="muted"></p><button onclick="reset()">기록 초기화</button></section>
<footer>음성은 기기의 일본어 음성 지원에 따라 달라질 수 있어요. 학습 기록은 이 기기에 저장됩니다.</footer>
</main><script>
const lessons=[
["こんにちは","곤니치와","안녕하세요","낮에 만났을 때 쓰는 기본 인사",["안녕하세요","감사합니다","잘 자요"],0],
["ありがとうございます","아리가토 고자이마스","감사합니다","정중하게 감사할 때 사용해요",["실례합니다","감사합니다","안녕히 가세요"],1],
["お願いします","오네가이시마스","부탁합니다","주문하거나 도움을 요청할 때 유용해요",["부탁합니다","맛있어요","모르겠어요"],0],
["はじめまして","하지메마시테","처음 뵙겠습니다","처음 만난 사람에게 하는 인사예요",["안녕히 주무세요","처음 뵙겠습니다","잘 먹겠습니다"],1],
["すみません","스미마센","실례합니다 / 죄송합니다","직원을 부르거나 사과할 때 써요",["괜찮아요","얼마예요?","실례합니다"],2],
["これは何ですか？","코레와 난 데스카?","이것은 무엇인가요?","물건의 이름을 물어볼 때 사용해요",["이것은 무엇인가요?","어디예요?","맛있어요"],0],
["よく分かりません","요쿠 와카리마센","잘 모르겠습니다","상대방의 말을 이해하지 못했을 때 말해요",["알겠습니다","잘 모르겠습니다","괜찮으세요?"],1],
["大丈夫ですか？","다이조부 데스카?","괜찮으세요?","상대방의 상태를 물어볼 때 사용해요",["괜찮으세요?","어디예요?","얼마예요?"],0],
["趣味は何ですか？","슈미와 난 데스카?","취미가 뭐예요?","대화를 시작하기 좋은 질문이에요",["어디에서 왔어요?","취미가 뭐예요?","이름이 뭐예요?"],1],
["韓国人です","칸코쿠진 데스","한국 사람입니다","자기소개에서 국적을 말할 때 써요",["일본 사람입니다","한국 사람입니다","학생입니다"],1]
];
let index=Number(localStorage.j10index||0),completed=Number(localStorage.j10completed||0);
const $=id=>document.getElementById(id);
function render(){let l=lessons[index%lessons.length];$("day").textContent=(index+1)+"일차 · 오늘의 표현";$("jp").textContent=l[0];$("reading").textContent=l[1];$("meaning").textContent=l[2];$("tip").textContent=l[3];$("progress").style.width=((index%4+1)*25)+"%";$("question").textContent="「"+l[0]+"」의 뜻은?";$("options").innerHTML="";l[4].forEach((v,n)=>{let b=document.createElement("button");b.className="option";b.textContent=v;b.onclick=()=>{$("feedback").textContent=n===l[5]?"정답이에요! 잘했어요 👏":"괜찮아요. 정답은 "+l[4][l[5]]+"예요.";};$("options").append(b)});$("record").textContent="완료한 표현 "+completed+"개 · 현재 "+(index+1)+"일차";localStorage.j10index=index;localStorage.j10completed=completed}
function speak(rate){if(!("speechSynthesis"in window)){alert("이 브라우저는 음성 재생을 지원하지 않아요.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessons[index%lessons.length][0]);u.lang="ja-JP";u.rate=rate;speechSynthesis.speak(u)}
function next(){index++;completed++;render();$("feedback").textContent="좋아요! 다음 표현도 익혀봐요."}
function reset(){if(confirm("학습 기록을 초기화할까요?")){index=0;completed=0;render();$("feedback").textContent=""}}
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){let waiting=null;const note=document.createElement('p');note.style.cssText='display:none;background:#eaf2ff;padding:12px;border-radius:12px';note.innerHTML='새 버전이 준비됐어요. <button id="updateNow">지금 업데이트</button>';document.querySelector('main').prepend(note);navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{const show=w=>{waiting=w;note.style.display='block'};if(reg.waiting)show(reg.waiting);reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});reg.update().catch(()=>{})});note.addEventListener('click',()=>waiting&&waiting.postMessage({type:'SKIP_WAITING'}));let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}})}
</script></body></html>
